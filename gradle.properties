#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# The Kotlin/Native compiler runs in its own JVM, and its default heap is not enough for the
# release-framework link: whole-program LTO over the shared module plus Compose OOMs during
# CallGraphBuilder. Debug frameworks link fine either way — only the release link needs this.
kotlin.native.jvmArgs=-Xmx5g

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
useMavenLocal=true